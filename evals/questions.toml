# --- ranking: who is top ------------------------------------------------------------

[[question]]
id = "most-points-single-game"
notes = "Checked: Bam Adebayo, 83 vs WAS on 2026-03-10 (https://en.wikipedia.org/wiki/Bam_Adebayo%27s_83-point_game)."
question = "What is the most points scored by a player in a single game from 2015-16 to 2025-26, and who scored it?"
category = "ranking"
difficulty = "simple"
sql = """
SELECT p.full_name, g.game_date, s.pts
FROM player_game_stats s JOIN games g USING (game_id) JOIN players p USING (player_id)
WHERE g.season BETWEEN '2015-16' AND '2025-26'
  AND s.pts = (SELECT MAX(s2.pts) FROM player_game_stats s2 JOIN games g2 USING (game_id)
               WHERE g2.season BETWEEN '2015-16' AND '2025-26')
"""

[[question]]
id = "most-50-point-games"
notes = "Four, not five: 5th and 6th are tied on 9 (Dončić and Embiid)."
question = "Which four players had the most 50-point games from 2015-16 to 2025-26, regular season and playoffs, and how many each?"
category = "ranking"
difficulty = "simple"
sql = """
SELECT p.full_name, COUNT(*) AS games
FROM player_game_stats s JOIN games g USING (game_id) JOIN players p USING (player_id)
WHERE s.pts >= 50 AND g.season BETWEEN '2015-16' AND '2025-26'
GROUP BY s.player_id ORDER BY games DESC LIMIT 4
"""

[[question]]
