[[question]]
id = "starter-vs-bench-points-2024-25"
question = "In the 2024-25 regular season, what share of all points were scored by starters?"
category = "split"
difficulty = "hard"
tolerance = 0.005
notes = "Claude check (no published number): a second query using final scores as the total gives 192,635 / 280,010 = 0.688. A fraction between 0 and 1, so the tolerance is tighter than the default."
sql = """
SELECT ROUND(1.0 * SUM(CASE WHEN s.starter = 1 THEN s.pts ELSE 0 END) / SUM(s.pts), 3) AS share
FROM player_game_stats s JOIN games g USING (game_id)
WHERE g.season = '2024-25' AND g.season_type = 'Regular Season'
"""

# --- team: records, margins, totals -------------------------------------------------

[[question]]
id = "warriors-record-2015-16"
notes = "Claude check (match): BBRef 73-9 (https://www.basketball-reference.com/leagues/NBA_2016.html)."
question = "What was the Warriors' regular season record in 2015-16?"
category = "team"
difficulty = "simple"
sql = """
SELECT SUM(won) AS wins, SUM(1 - won) AS losses FROM (
  SELECT CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE t.abbreviation = 'GSW' AND g.season = '2015-16' AND g.season_type = 'Regular Season'
)
"""

[[question]]
id = "most-wins-season"
notes = "Claude check (match): GSW 73-9; next is OKC 2024-25 at 68-14 (https://www.basketball-reference.com/leagues/NBA_2025.html)."
question = "Which team won the most regular season games in a single season from 2015-16 to 2025-26?"
category = "team"
difficulty = "hard"
sql = """
WITH results AS (
  SELECT g.season, t.abbreviation,
         CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
)
SELECT abbreviation, season, SUM(won) AS wins
FROM results GROUP BY abbreviation, season ORDER BY wins DESC LIMIT 1
"""

[[question]]
id = "biggest-margin"
notes = "Claude check (match): 152-79 is the NBA record margin, 73. No page opened; widely reported."
question = "What was the biggest margin of victory in a game from 2015-16 to 2025-26?"
category = "team"
difficulty = "simple"
sql = """
SELECT g.game_date, home.abbreviation AS home, g.home_pts, away.abbreviation AS away, g.away_pts,
       ABS(g.home_pts - g.away_pts) AS margin
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season BETWEEN '2015-16' AND '2025-26'
  AND ABS(g.home_pts - g.away_pts) = (SELECT MAX(ABS(home_pts - away_pts)) FROM games
                                      WHERE season BETWEEN '2015-16' AND '2025-26')
"""

[[question]]
id = "highest-combined-score"
notes = "Claude check (match): SAC 176, LAC 175 in double overtime (https://www.cbssports.com/nba/news/kings-clippers-thriller-10-crazy-numbers-including-malik-monks-bench-explosion-and-a-kawhi-leonard-first). Highest without overtime is 317 (2019-10-30)."
question = "Which game had the highest combined score from 2015-16 to 2025-26?"
category = "team"
difficulty = "simple"
sql = """
SELECT g.game_date, home.abbreviation AS home, away.abbreviation AS away,
       g.home_pts + g.away_pts AS total
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season BETWEEN '2015-16' AND '2025-26'
  AND g.home_pts + g.away_pts = (SELECT MAX(home_pts + away_pts) FROM games
                                 WHERE season BETWEEN '2015-16' AND '2025-26')
"""

[[question]]
id = "celtics-ppg-2023-24"
notes = "Claude check (match): BBRef 120.6 (https://www.basketball-reference.com/teams/BOS/2024.html)."
question = "How many points per game did the Celtics score in the 2023-24 regular season?"
category = "team"
difficulty = "simple"
sql = """
SELECT ROUND(AVG(CASE WHEN g.home_team_id = t.team_id THEN g.home_pts ELSE g.away_pts END), 1) AS ppg
FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
WHERE t.abbreviation = 'BOS' AND g.season = '2023-24' AND g.season_type = 'Regular Season'
"""

[[question]]
id = "celtics-heat-2023-playoffs"
notes = "Claude check (match): Heat won the 2023 East finals 4-3; the DB's 7 games run 5/17 to 5/29."
question = "How many games did the Celtics and the Heat each win against each other in the 2022-23 playoffs?"
category = "team"
difficulty = "hard"
sql = """
SELECT CASE WHEN g.home_pts > g.away_pts THEN home.abbreviation ELSE away.abbreviation END AS team,
       COUNT(*) AS wins
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season = '2022-23' AND g.season_type = 'Playoffs'
  AND home.abbreviation IN ('BOS', 'MIA') AND away.abbreviation IN ('BOS', 'MIA')
GROUP BY team
"""

[[question]]
id = "league-scoring-then-and-now"
notes = "Claude check (match): BBRef league average 102.7 (2016 page) and 113.8 (2025 page)."
question = "How many points per game did an average team score in the 2015-16 regular season, and in 2024-25?"
category = "team"
difficulty = "hard"
sql = """
SELECT season, ROUND(AVG(pts), 1) AS ppg FROM (
  SELECT season, home_pts AS pts FROM games WHERE season_type = 'Regular Season'
  UNION ALL
  SELECT season, away_pts FROM games WHERE season_type = 'Regular Season'
)
WHERE season IN ('2015-16', '2024-25')
GROUP BY season
"""

[[question]]
id = "most-130-point-games-2023-24"
notes = "Claude check (match): StatMuse IND 25, MIL 19, BOS 17; a second query summing player points agrees (https://www.statmuse.com/nba/ask/most-games-with-130-points-by-a-team-in-2023-24-regular-season)."
question = "Which team scored 130 or more points in the most regular season games in 2023-24?"
category = "team"
difficulty = "simple"
sql = """
SELECT t.abbreviation, COUNT(*) AS games
FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
WHERE g.season = '2023-24' AND g.season_type = 'Regular Season'
  AND CASE WHEN g.home_team_id = t.team_id THEN g.home_pts ELSE g.away_pts END >= 130
GROUP BY t.team_id ORDER BY games DESC LIMIT 1
"""

[[question]]
id = "best-home-record"
notes = "Claude check (match): Spurs 40-1 at home, tying the NBA record (https://en.wikipedia.org/wiki/2015%E2%80%9316_San_Antonio_Spurs_season)."
question = "Which team had the best home record in a single regular season from 2015-16 to 2025-26?"
category = "team"
difficulty = "hard"
sql = """
SELECT t.abbreviation, g.season, SUM(g.home_pts > g.away_pts) AS home_wins,
       SUM(g.home_pts < g.away_pts) AS home_losses
FROM games g JOIN teams t ON t.team_id = g.home_team_id
WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
GROUP BY t.team_id, g.season ORDER BY 1.0 * home_wins / COUNT(*) DESC LIMIT 1
"""

# --- streak: runs of games ----------------------------------------------------------

[[question]]
id = "longest-win-streak"
question = "What was the longest winning streak by a team within a single regular season from 2015-16 to 2025-26?"
category = "streak"
difficulty = "hard"
notes = "Claude check (match): GSW's 24-0 start; a second query agrees. 28 counts the 4 wins that ended 2014-15, so an answer of 28 is wrong here. Within one season only. A streak carried over from the season before doesn't count."
sql = """
WITH results AS (
  SELECT t.abbreviation, g.season, g.game_date,
         CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
),
runs AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY abbreviation, season ORDER BY game_date)
          - ROW_NUMBER() OVER (PARTITION BY abbreviation, season, won ORDER BY game_date) AS run
  FROM results
),
streaks AS (
  SELECT abbreviation, season, COUNT(*) AS games FROM runs WHERE won = 1
  GROUP BY abbreviation, season, run
)
SELECT abbreviation, season, games FROM streaks
WHERE games = (SELECT MAX(games) FROM streaks)
"""

[[question]]
id = "longest-losing-streak"
question = "What was the longest losing streak by a team within a single regular season from 2015-16 to 2025-26?"
category = "streak"
difficulty = "hard"
notes = "Claude check (match): DET's 28 is the single-season record; PHI's 28 crossed two seasons and starts before 2015-16. Within one season only."
sql = """
WITH results AS (
  SELECT t.abbreviation, g.season, g.game_date,
         CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
),
runs AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY abbreviation, season ORDER BY game_date)
          - ROW_NUMBER() OVER (PARTITION BY abbreviation, season, won ORDER BY game_date) AS run
  FROM results
),
streaks AS (
  SELECT abbreviation, season, COUNT(*) AS games FROM runs WHERE won = 0
  GROUP BY abbreviation, season, run
)
SELECT abbreviation, season, games FROM streaks
WHERE games = (SELECT MAX(games) FROM streaks)
"""

[[question]]
id = "longest-30-point-streak"
question = "What is the longest run of consecutive regular season games with 30+ points by one player within a season, from 2015-16 to 2025-26?"
category = "streak"
difficulty = "hard"
notes = "Claude check (match): the streak ended at 32 (https://www.nba.com/news/harden-30-point-streak-ends). Consecutive games the player appeared in. Games he missed don't break the run."
sql = """
WITH games_played AS (
  SELECT s.player_id, g.season, g.game_date, s.pts >= 30 AS hit
  FROM player_game_stats s JOIN games g USING (game_id)
  WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
),
runs AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY player_id, season ORDER BY game_date)
          - ROW_NUMBER() OVER (PARTITION BY player_id, season, hit ORDER BY game_date) AS run
  FROM games_played
),
streaks AS (
  SELECT player_id, season, COUNT(*) AS games FROM runs WHERE hit
  GROUP BY player_id, season, run
)
SELECT p.full_name, s.season, s.games
FROM streaks s JOIN players p USING (player_id)
WHERE s.games = (SELECT MAX(games) FROM streaks)
"""

[[question]]
id = "longest-double-double-streak-2024-25"
question = "Who had the longest streak of consecutive double-doubles in the 2024-25 regular season, and how long was it?"
category = "streak"
difficulty = "hard"
notes = "Claude check (partly confirmed): BBRef game log shows 24 straight from 12/05 to 1/29, between 7-rebound games on 12/03 and 2/01 (https://www.basketball-reference.com/players/s/sabondo01/gamelog/2025). No source lists every player's 2024-25 streaks, so 'longest' rests on the DB. Streak SQL checked: the same query on 2023-24 returns Sabonis, 61, the streak ESPN reports (https://www.espn.com/nba/story/_/id/39911469/sabonis-double-double-streak-ends-61-kings-loss). The 2024-25 answer itself isn't checked yet. Consecutive games the player appeared in."
sql = """
WITH games_played AS (
  SELECT s.player_id, g.game_date,
         (s.pts >= 10) + (s.reb >= 10) + (s.ast >= 10) + (s.stl >= 10) + (s.blk >= 10) >= 2 AS hit
  FROM player_game_stats s JOIN games g USING (game_id)
  WHERE g.season = '2024-25' AND g.season_type = 'Regular Season'
),
runs AS (
  SELECT *, ROW_NUMBER() OVER (PARTITION BY player_id ORDER BY game_date)
          - ROW_NUMBER() OVER (PARTITION BY player_id, hit ORDER BY game_date) AS run
  FROM games_played
),
streaks AS (
  SELECT player_id, COUNT(*) AS games FROM runs WHERE hit GROUP BY player_id, run
)
SELECT p.full_name, s.games
FROM streaks s JOIN players p USING (player_id)
WHERE s.games = (SELECT MAX(games) FROM streaks)
"""

# --- edge: questions that are easy to get subtly wrong ------------------------------

[[question]]
id = "harden-teams-2020-21"
question = "Which teams did James Harden play for in the 2020-21 regular season, and how many games for each?"
category = "edge"
difficulty = "simple"
notes = "Claude check (match): 8 games with HOU, 36 with BKN, as on BBRef. Traded mid-season: the team is on each game row, not on the player."
sql = """
SELECT t.abbreviation, COUNT(*) AS games
FROM player_game_stats s JOIN games g USING (game_id) JOIN teams t ON t.team_id = s.team_id
WHERE s.player_id = 201935 AND g.season = '2020-21' AND g.season_type = 'Regular Season'
GROUP BY t.abbreviation
"""

[[question]]
id = "most-teams-played-for"
notes = "Claude check (match): CLE traded him to CHA in August 2026 (https://nba.com/news/charlotte-cleveland-trade-schroder-mann). Pinned to 2025-26, so it stays 11. Checked: sources count 12 career teams, but the 12th (CHA) is a trade with no games yet, so 11 teams played for is right (https://sportskeeda.com/basketball/news-how-many-nba-teams-dennis-schroder-played-for-latest-veteran-journeyman-s-career-heat-move-utah)."
question = "Which player played for the most different teams from 2015-16 to 2025-26?"
category = "edge"
difficulty = "hard"
sql = """
WITH teams_per_player AS (
  SELECT s.player_id, COUNT(DISTINCT s.team_id) AS teams
  FROM player_game_stats s JOIN games g USING (game_id)
  WHERE g.season BETWEEN '2015-16' AND '2025-26'
  GROUP BY s.player_id
)
SELECT p.full_name, t.teams
FROM teams_per_player t JOIN players p USING (player_id)
WHERE t.teams = (SELECT MAX(teams) FROM teams_per_player)
"""

[[question]]
id = "curry-total-minutes-2015-16"
question = "How many minutes did Stephen Curry play in total in the 2015-16 regular season?"
category = "edge"
difficulty = "simple"
tolerance = 1
notes = "Claude check (match): BBRef MP 2,700 (https://www.basketball-reference.com/players/c/curryst01.html). Exact seconds, so the total is within a minute, not off by up to 79 minutes of rounding."
sql = """
SELECT ROUND(SUM(s.seconds) / 60.0) AS minutes
FROM player_game_stats s JOIN games g USING (game_id)
WHERE s.player_id = 201939 AND g.season = '2015-16' AND g.season_type = 'Regular Season'
"""

[[question]]
id = "regular-season-and-playoffs-2015-16-curry"
question = "How many games did Stephen Curry play in 2015-16, regular season and playoffs together?"
category = "edge"
difficulty = "simple"
notes = "Claude check (match): BBRef 79 regular season + 18 playoff games. Both season types: an answer with only the regular season is wrong."
sql = """
SELECT COUNT(*) AS games
FROM player_game_stats s JOIN games g USING (game_id)
WHERE s.player_id = 201939 AND g.season = '2015-16'
"""

[[question]]
id = "bubble-season-games-per-team"
question = "Which teams played the fewest regular season games in 2019-20, and how many?"
category = "edge"
difficulty = "hard"
notes = "Claude check (match): BBRef MIN 19-45, the only team with 64; four teams had 65 (https://www.basketball-reference.com/leagues/NBA_2020_standings.html). The season stopped in March 2020; only 22 teams went to the Orlando bubble."
sql = """
WITH per_team AS (
  SELECT t.abbreviation, COUNT(*) AS games
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE g.season = '2019-20' AND g.season_type = 'Regular Season'
  GROUP BY t.team_id
)
SELECT abbreviation, games FROM per_team WHERE games = (SELECT MIN(games) FROM per_team)
"""

[[question]]
id = "three-point-percentage-curry-2015-16"
question = "What was Stephen Curry's three-point percentage in the 2015-16 regular season?"
category = "edge"
difficulty = "simple"
notes = "Claude check (match): BBRef 402/886 = .454 in 79 games (https://www.basketball-reference.com/players/c/curryst01.html). Total makes over total attempts, not the average of per-game percentages."
tolerance = 0.0005
sql = """
SELECT ROUND(1.0 * SUM(s.fg3m) / SUM(s.fg3a), 3) AS fg3_pct
FROM player_game_stats s JOIN games g USING (game_id)
WHERE s.player_id = 201939 AND g.season = '2015-16' AND g.season_type = 'Regular Season'
"""
