"""

[[question]]
id = "starter-vs-bench-points-2024-25"
question = "In the 2024-25 regular season, what share of all points were scored by starters?"
category = "split"
difficulty = "hard"
tolerance = 0.005
notes = "A fraction between 0 and 1, so the tolerance is tighter than the default."
sql = """
SELECT ROUND(1.0 * SUM(CASE WHEN s.starter = 1 THEN s.pts ELSE 0 END) / SUM(s.pts), 3) AS share
FROM player_game_stats s JOIN games g USING (game_id)
WHERE g.season = '2024-25' AND g.season_type = 'Regular Season'
"""

# --- team: records, margins, totals -------------------------------------------------

[[question]]
id = "warriors-record-2015-16"
question = "What was the Warriors' regular season record in 2015-16?"
category = "team"
difficulty = "simple"
sql = """
SELECT SUM(won) AS wins, SUM(1 - won) AS losses FROM (
  SELECT CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE t.abbreviation = 'GSW' AND g.season = '2015-16' AND g.season_type = 'Regular Season'
)
"""

[[question]]
id = "most-wins-season"
question = "Which team won the most regular season games in a single season from 2015-16 to 2025-26?"
category = "team"
difficulty = "hard"
sql = """
WITH results AS (
  SELECT g.season, t.abbreviation,
         CASE WHEN (g.home_team_id = t.team_id) = (g.home_pts > g.away_pts) THEN 1 ELSE 0 END AS won
  FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
  WHERE g.season_type = 'Regular Season' AND g.season BETWEEN '2015-16' AND '2025-26'
)
SELECT abbreviation, season, SUM(won) AS wins
FROM results GROUP BY abbreviation, season ORDER BY wins DESC LIMIT 1
"""

[[question]]
id = "biggest-margin"
question = "What was the biggest margin of victory in a game from 2015-16 to 2025-26?"
category = "team"
difficulty = "simple"
sql = """
SELECT g.game_date, home.abbreviation AS home, g.home_pts, away.abbreviation AS away, g.away_pts,
       ABS(g.home_pts - g.away_pts) AS margin
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season BETWEEN '2015-16' AND '2025-26'
  AND ABS(g.home_pts - g.away_pts) = (SELECT MAX(ABS(home_pts - away_pts)) FROM games
                                      WHERE season BETWEEN '2015-16' AND '2025-26')
"""

[[question]]
id = "highest-combined-score"
question = "Which game had the highest combined score from 2015-16 to 2025-26?"
category = "team"
difficulty = "simple"
sql = """
SELECT g.game_date, home.abbreviation AS home, away.abbreviation AS away,
       g.home_pts + g.away_pts AS total
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season BETWEEN '2015-16' AND '2025-26'
  AND g.home_pts + g.away_pts = (SELECT MAX(home_pts + away_pts) FROM games
                                 WHERE season BETWEEN '2015-16' AND '2025-26')
"""

[[question]]
id = "celtics-ppg-2023-24"
question = "How many points per game did the Celtics score in the 2023-24 regular season?"
category = "team"
difficulty = "simple"
sql = """
SELECT ROUND(AVG(CASE WHEN g.home_team_id = t.team_id THEN g.home_pts ELSE g.away_pts END), 1) AS ppg
FROM games g JOIN teams t ON t.team_id IN (g.home_team_id, g.away_team_id)
WHERE t.abbreviation = 'BOS' AND g.season = '2023-24' AND g.season_type = 'Regular Season'
"""

[[question]]
id = "celtics-heat-2023-playoffs"
question = "How many games did the Celtics and the Heat each win against each other in the 2022-23 playoffs?"
category = "team"
difficulty = "hard"
sql = """
SELECT CASE WHEN g.home_pts > g.away_pts THEN home.abbreviation ELSE away.abbreviation END AS team,
       COUNT(*) AS wins
FROM games g
JOIN teams home ON home.team_id = g.home_team_id
JOIN teams away ON away.team_id = g.away_team_id
WHERE g.season = '2022-23' AND g.season_type = 'Playoffs'
  AND home.abbreviation IN ('BOS', 'MIA') AND away.abbreviation IN ('BOS', 'MIA')
