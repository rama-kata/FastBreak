# FastBreak test set: questions with the SQL that answers them.
#
# Fields
#   id          short, unique, never reused
#   question    what a user would type
#   sql         the query whose rows are the correct answer
#   category    lookup | ranking | count | split | team | streak | edge
#   difficulty  simple (small local model) | hard (large model)
#   status      draft until a person has checked the answer, then approved.
#               Only approved questions count towards the score.
#   ordered     true when the order of the rows is part of the answer (default false)
#   frozen      false for current-season questions, whose answer changes (default true)
#   tolerance   how close numbers must be (default 0.05: averages to 1 decimal)
#   notes       how the answer was checked, and anything a reviewer should know
#
# Answers that shouldn't change say "2015-16 to 2025-26" and filter on those seasons, so
# the nightly load can't move them. A frozen answer lives in evals/answers/<id>.json.
#
# Shared definitions
#   minutes        seconds / 60.0
#   off the bench  starter = 0
#   double-double  10+ in at least two of pts, reb, ast, stl, blk (three for a triple-double)
#   per game       over the games a player appeared in
#   a team's game  its points and the opponent's come from games.home_pts / away_pts

# --- lookup: one fact about one player or game ---------------------------------------

[[question]]
id = "curry-ppg-2015-16"
question = "What was Stephen Curry's points per game in the 2015-16 regular season?"
category = "lookup"
difficulty = "simple"
sql = """
SELECT ROUND(AVG(s.pts), 1) AS ppg
FROM player_game_stats s JOIN games g USING (game_id)
WHERE s.player_id = 201939 AND g.season = '2015-16' AND g.season_type = 'Regular Season'
"""

